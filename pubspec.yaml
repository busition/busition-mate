name: Busition_Mate
description: Busition Package For passenger

# The following line prevents the package from being accidentally published to
# pub.dev using `pub publish`. This is preferred for private packages.
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

environment:
  sdk: ">=2.12.0 <3.0.0"
  flutter: ">=1.20.0"

dependencies:
  flutter:
    sdk: flutter

  firebase_core: ^2.13.0
  firebase_messaging: ^14.6.4
  flutter_local_notifications: ^9.2.0
  firebase: ^9.0.3
  google_maps_flutter: ^2.4.0
  permission_handler: ^10.2.0
  cupertino_icons: ^1.0.2
  geolocator: ^9.0.2
  http: ^0.13.5
  google_maps_routes: ^1.1.2
  latlong2: ^0.8.1
  flutter_ble_peripheral: ^1.1.1
  web_socket_channel: ^2.3.0
  dynamic_color: ^1.6.3
  animations: ^2.0.7
  socket_io_client: ^2.0.2
  firebase_auth: ^4.2.2
  google_sign_in: ^6.1.0
  page_view_dot_indicator: ^2.1.0
  flutter_secure_storage: ^8.0.0
  flutter_login: 4.2.0





dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^1.0.0

# The following section is specific to Flutter.
flutter:

  # The following line ensures that the Material Icons font is
  # included with your application, so that you can use the icons in
  # the material Icons class.
  uses-material-design: true

  # To add assets to your application, add an assets section, like this:
  # assets:
  #   - images/a_dot_burr.jpeg
  #   - images/a_dot_ham.jpeg

  # An image asset can refer to one or more resolution-specific "variants", see
  # https://flutter.dev/assets-and-images/#resolution-aware.

  # For details regarding adding assets from package dependencies, see
  # https://flutter.dev/assets-and-images/#from-packages

  # To add custom fonts to your application, add a fonts section here,
  # in this "flutter" section. Each entry in this list should have a
  # "family" key with the font family name, and a "fonts" key with a
  # list giving the asset and other descriptors for the font. For
  # example:
  # fonts:
  #   - family: Schyler
  #     fonts:
  #       - asset: fonts/Schyler-Regular.ttf
  #       - asset: fonts/Schyler-Italic.ttf
  #         style: italic
  #   - family: Trajan Pro
  #     fonts:
  #       - asset: fonts/TrajanPro.ttf
  #       - asset: fonts/TrajanPro_Bold.ttf
  #         weight: 700
  #
  # For details regarding fonts from package dependencies,
  # see https://flutter.dev/custom-fonts/#from-packages
  assets:
    - build/app/outputs/bundle/release/
    - assets/image/
  fonts:
    - family: PretendardThin
      fonts:
        - asset: assets/fonts/Pretendard-Thin.otf
    - family: PretendardBold
      fonts:
        - asset: assets/fonts/Pretendard-Bold.otf
    - family: PretendardLight
      fonts:
        - asset: assets/fonts/Pretendard-Light.otf
    - family: PretendardMedium
      fonts:
        - asset: assets/fonts/Pretendard-Medium.otf
    - family: PretendardBlack
      fonts:
        - asset: assets/fonts/Pretendard-Black.otf
